<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FabricLens Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
      padding: 20px;
      font-size: 13px;
      line-height: 1.5;
    }
    h2 { font-size: 15px; margin-bottom: 6px; }
    p.desc { font-size: 11.5px; color: #999; margin-bottom: 14px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #888; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: #232323;
      border: 1px solid #444;
      border-radius: 6px;
      color: #f0f0f0;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    input[type="password"]:focus { border-color: #7ab8e0; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    button {
      flex: 1;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #444;
      transition: all 0.15s;
    }
    .btn-save { background: #2d6a3e; color: #c5e8d0; border-color: #2d6a3e; }
    .btn-save:hover { background: #358a4e; }
    .btn-clear { background: transparent; color: #c0392b; border-color: #c0392b44; }
    .btn-clear:hover { background: #c0392b22; }
    .status { font-size: 11px; color: #7ecf9a; margin-top: 10px; min-height: 16px; }
    .status.error { color: #e07840; }
    a { color: #7ab8e0; }
  </style>
</head>
<body>
  <h2>🔍 FabricLens Settings</h2>
  <p class="desc">
    Add your Anthropic API key to enable image-based material scanning.
    This uses Claude's vision to read care labels from product photos.
    Your key is stored locally and never sent anywhere except the Anthropic API.
    <br><br>
    Get a key at <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>
  </p>

  <label for="api-key">Anthropic API Key</label>
  <input type="password" id="api-key" placeholder="sk-ant-api03-...">

  <div class="btn-row">
    <button class="btn-save" id="btn-save">Save Key</button>
    <button class="btn-clear" id="btn-clear">Clear Key</button>
  </div>
  <p class="status" id="status"></p>

  <script src="settings.js"></script>
</body>
</html>
